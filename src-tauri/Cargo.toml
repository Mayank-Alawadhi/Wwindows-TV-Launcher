[package]
name = "windows-tv-launcher"
version = "1.0.0"
description = "A keyboard-first streaming launcher for Windows"
authors = ["You"]
edition = "2021"

[lib]
name = "windows_tv_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
